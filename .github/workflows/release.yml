name: Release

# HACS installs the zip attached to each release (zip_release in hacs.json), so GitHub counts
# every download. The zip holds the files of custom_components/trade_republic at its root.
#
# Releases are immutable: once published, neither their tag nor their files can change. So the
# zip is attached while the release is a draft: pushing a tag v* creates the draft with the zip,
# and the release is published by hand after writing its notes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose draft release gets the zip
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - name: Check the version
        run: |
          version=$(jq -r .version custom_components/trade_republic/manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "manifest.json says $version, the tag is $TAG"
            exit 1
          fi
      - name: Zip the integration
        run: cd custom_components/trade_republic && zip -r -X ../../trade_republic.zip . -x '__pycache__/*'
      - name: Attach it to a draft release
        # On a published release the upload fails: its files cannot change any more.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" trade_republic.zip --clobber
          else
            gh release create "$TAG" trade_republic.zip --draft --verify-tag --title "$TAG" --notes "To be written before publishing."
          fi
